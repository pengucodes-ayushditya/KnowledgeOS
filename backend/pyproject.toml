[project]
name = "backend"
version = "0.1.0"
description = "KnowledgeOS workspace API and local timestamped video/audio RAG feature"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.128.8",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.2.13",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.51",
    "structlog>=25.5.0",
    "uvicorn>=0.39.0",
]

[project.optional-dependencies]
media = [
    "openai-whisper==20250625",
]
